name: Release Web Build

on:
  push:
    tags:
      - "web-*"

permissions:
  contents: write

jobs:
  release_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cat .github/workflows/versions.env >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      # CanvasKit is served from the app itself instead of Google's CDN
      - run: flutter build web --release --no-web-resources-cdn
      - name: Package build/web
        run: |
          tarball="fun-with-kanji-${GITHUB_REF_NAME}.tar.gz"
          tar -C build/web -czf "$tarball" .
          sha256sum "$tarball" > "$tarball.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Web build of ${GITHUB_SHA} with Flutter ${FLUTTER_VERSION}." \
            "fun-with-kanji-${GITHUB_REF_NAME}.tar.gz" \
            "fun-with-kanji-${GITHUB_REF_NAME}.tar.gz.sha256"
